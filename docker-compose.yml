version: '3.8'

services:
  # Qdrant向量数据库
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: face_access_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./services/qdrant/storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__API_KEY=face_access_2025
    restart: unless-stopped
    networks:
      - face_access_network

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: face_access_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./services/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./services/mqtt/data:/mosquitto/data
      - ./services/mqtt/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - face_access_network

  # Node-RED - 主控制服务器
  node-red:
    image: nodered/node-red:3.1
    container_name: face_access_nodered
    ports:
      - "1880:1880"
    volumes:
      - ./services/node_red/data:/data
      - ./flows:/data/flows
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - face_access_network
    depends_on:
      - mosquitto
      - qdrant

  # FaceEmbed API - 仅用于本地测试
  # 在生产环境中，这个服务运行在Hailo设备上
  face-embed-api:
    build:
      context: ./services/face_embed_api
      dockerfile: Dockerfile
    container_name: face_access_embed_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - face_access_network
    profiles:
      - local-test  # 仅在本地测试时启用

networks:
  face_access_network:
    driver: bridge
