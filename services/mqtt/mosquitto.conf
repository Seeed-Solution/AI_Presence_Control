# Mosquitto MQTT Broker Configuration for Face Access Control System

# Network settings
listener 1883
protocol mqtt

# WebSocket support
listener 9001
protocol websockets

# Security settings
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections 1000
max_keepalive 3600

# Message settings
max_packet_size 102400
message_size_limit 102400

# Quality of Service
max_queued_messages 1000
max_inflight_messages 40

# Retained messages
retained_persistence true
max_retained_messages 1000

# Statistics
sys_interval 10
